name: Opportunity
description: Suggest an improvement, correction, or gap in the framework
title: "[Opportunity] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution — the same way the framework does.
        Questions and disagreement are welcome; this does not have to become a pull request.

  - type: textarea
    id: opportunity
    attributes:
      label: The opportunity
      description: What did you observe, and why does it matter?
      placeholder: The Proof stage doesn't say what to do when there's no telemetry available...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: The outcome you're after
      description: What would "better" look like?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything that helps us understand it — where you hit this, what you tried, relevant links.
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - Clarity or correctness in the docs
        - A gap in the model
        - A field lesson from real experience
        - A case study
        - A reference implementation
        - Question or discussion
    validations:
      required: false
