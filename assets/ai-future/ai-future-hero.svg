  <text x="380" y="168" font-size="20" font-weight="700" letter-spacing="2.5" fill="#0a6a5f">A QUESTION ABOUT GROWTH</text>
  <text x="380" y="238" font-size="58" font-weight="700" fill="#14181d">The AI future</text>
  <path d="M380 268H620" stroke="#7fb8b0" stroke-width="3" stroke-linecap="round"/>

  <g font-size="30" fill="#39424d">
    <text x="380" y="326">With everything AI can already do,</text>
    <text x="380" y="366">how much more growth do we seek,</text>
    <text x="380" y="406">and in the progress of growth</text>
    <text x="380" y="446">do we still stay in control?</text>
  </g>

  <text x="380" y="490" font-size="19" fill="#66717e">A question, not a prediction. It names no actor.</text>
