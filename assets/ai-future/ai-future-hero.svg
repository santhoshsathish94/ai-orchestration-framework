<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">The AI Future: the race to autonomy</title><desc id="d">A technical hypothesis. Capability rises from AI models through agents and agentic workflows toward autonomy, with a dashed line marking the level of restraint that competitive pressure may push a system past.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><radialGradient id="glow"><stop stop-color="#bfdbfe"/><stop offset="1" stop-color="#eff6ff" stop-opacity="0"/></radialGradient></defs><rect width="1400" height="700" fill="url(#bg)"/><circle cx="1070" cy="330" r="330" fill="url(#glow)"/><g font-family="Arial,sans-serif"><rect x="80" y="105" width="650" height="490" rx="36" fill="#fff" stroke="#dbeafe" stroke-width="4"/><text x="125" y="180" font-size="24" font-weight="700" fill="#2563eb">TECHNICAL HYPOTHESIS</text><text x="125" y="252" font-size="52" font-weight="700" fill="#0f172a">The AI Future</text><text x="125" y="325" font-size="34" font-weight="600" fill="#334155">What happens when</text><text x="125" y="370" font-size="34" font-weight="600" fill="#334155">restraint itself becomes</text><text x="125" y="415" font-size="34" font-weight="600" fill="#334155">a competitive disadvantage?</text><text x="125" y="487" font-size="22" fill="#64748b">A hypothesis about the path — not a prediction,</text><text x="125" y="519" font-size="22" fill="#64748b">and it names no actor.</text><g stroke="#93c5fd" stroke-width="4"><rect x="820" y="470" width="110" height="92" rx="14" fill="#dbeafe"/><rect x="950" y="410" width="110" height="152" rx="14" fill="#dbeafe"/><rect x="1080" y="340" width="110" height="222" rx="14" fill="#dbeafe"/></g><rect x="1210" y="248" width="110" height="314" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="4"/><path d="M800 562h540" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/><path d="M800 302h545" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/><text x="800" y="288" font-size="21" font-weight="700" fill="#b45309">restraint</text><g font-size="20" fill="#475569" text-anchor="middle"><text x="875" y="592">Models</text><text x="1005" y="592">Agents</text><text x="1135" y="592">Workflows</text><text x="1265" y="592" font-weight="700" fill="#1d4ed8">Autonomy</text></g></g></svg>
