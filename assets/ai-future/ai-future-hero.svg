  <title id="hero-title">The AI future — the question Clover leaves open</title>
  <desc id="hero-desc">A solid black five-leaf clover beside the question this document asks: with everything AI can already do, how much more growth do we seek, and in the progress of growth do we still stay in control?</desc>

