<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">The pieces come together</title><desc id="d">Frontier models, agents, compute, tools, robotics and real-world feedback all connect into a single system. The intelligence does not have to live in any one model.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><rect width="1200" height="660" rx="32" fill="url(#g)"/><g font-family="Arial,sans-serif"><g stroke="#93c5fd" stroke-width="4"><path d="M405 138L600 300M795 138L600 300M225 290L600 300M975 290L600 300M405 442L600 300M795 442L600 300"/></g><circle cx="600" cy="300" r="102" fill="#2563eb"/><g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="600" y="294">Connected</text><text x="600" y="324">system</text></g><g fill="#fff" stroke="#cbd5e1" stroke-width="4"><rect x="300" y="110" width="210" height="56" rx="28"/><rect x="690" y="110" width="210" height="56" rx="28"/><rect x="120" y="262" width="210" height="56" rx="28"/><rect x="870" y="262" width="210" height="56" rx="28"/><rect x="300" y="414" width="210" height="56" rx="28"/><rect x="690" y="414" width="210" height="56" rx="28"/></g><g fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle"><text x="405" y="145">Frontier models</text><text x="795" y="145">Agents</text><text x="225" y="297">Compute</text><text x="975" y="297">Tools</text><text x="405" y="449">Robotics</text><text x="795" y="449">Real-world feedback</text></g><text x="600" y="558" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">The intelligence does not have to live in one model</text><text x="600" y="600" text-anchor="middle" font-size="22" fill="#475569">It can emerge from the connected system</text></g></svg>
