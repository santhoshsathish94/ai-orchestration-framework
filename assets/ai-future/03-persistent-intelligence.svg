<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">The world becomes the learning environment</title><desc id="d">A repeating loop: observe, decide, act, measure, learn, and repeat. Physical capacity closes a loop that a software-only system cannot.</desc><rect width="1200" height="620" rx="32" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="600" y="112" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">The world becomes the learning environment</text><g fill="#fff" stroke="#cbd5e1" stroke-width="4"><rect x="75" y="190" width="190" height="95" rx="20"/><rect x="290" y="190" width="190" height="95" rx="20"/><rect x="505" y="190" width="190" height="95" rx="20"/><rect x="720" y="190" width="190" height="95" rx="20"/><rect x="935" y="190" width="190" height="95" rx="20"/></g><g fill="#0f172a" font-size="25" font-weight="700" text-anchor="middle"><text x="170" y="246">Observe</text><text x="385" y="246">Decide</text><text x="600" y="246">Act</text><text x="815" y="246">Measure</text><text x="1030" y="246">Learn</text></g><g stroke="#2563eb" stroke-width="8" stroke-linecap="round"><path d="M269 237h10M484 237h10M699 237h10M914 237h10"/></g><g fill="#2563eb"><path d="M288 237l-16-12v24zM503 237l-16-12v24zM718 237l-16-12v24zM933 237l-16-12v24z"/></g><path d="M1030 285v70c0 22-18 40-40 40H210c-22 0-40-18-40-40v-50" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><path d="M170 285l-15 22h30z" fill="#2563eb"/><text x="600" y="452" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">repeat</text><text x="600" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Manufacturing, robotics and laboratories are a resource</text><text x="600" y="560" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">that compute cannot substitute</text></g></svg>
