<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">1. Cross-Team Knowledge Access</text>
<text x="70" y="118" font-family="Arial, sans-serif" font-size="21" fill="#526071">AI makes existing organizational knowledge directly accessible.</text>
<rect x="70" y="155" width="1260" height="150" rx="18" fill="#f5f8fb" stroke="#d7dee8"/>
<text x="105" y="198" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Underlying problem</text>
<text x="105" y="238" font-family="Arial, sans-serif" font-size="19" fill="#465365">People spend time finding who knows the answer instead of finding the answer itself.</text>
<text x="105" y="272" font-family="Arial, sans-serif" font-size="18" fill="#667386">Knowledge is scattered across repositories, tickets, telemetry, jobs, documents, and teams.</text>
<text x="70" y="355" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f7a4d">Reference capability</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<circle cx="180" cy="455" r="62" fill="#eef6ff" stroke="#5b8def" stroke-width="3"/><text x="180" y="462" font-size="22" font-weight="700" fill="#2454a6">Question</text>
<line x1="245" y1="455" x2="345" y2="455" stroke="#667386" stroke-width="3"/><polygon points="345,455 328,445 328,465" fill="#667386"/>
<circle cx="420" cy="455" r="62" fill="#f2f8f3" stroke="#4c9a68" stroke-width="3"/><text x="420" y="450" font-size="19" font-weight="700" fill="#277142">Gather</text><text x="420" y="475" font-size="17" fill="#277142">context</text>
<line x1="485" y1="455" x2="585" y2="455" stroke="#667386" stroke-width="3"/><polygon points="585,455 568,445 568,465" fill="#667386"/>
<circle cx="660" cy="455" r="62" fill="#fff8e9" stroke="#d49a28" stroke-width="3"/><text x="660" y="450" font-size="19" font-weight="700" fill="#8a6515">Explain</text><text x="660" y="475" font-size="17" fill="#8a6515">what happened</text>
<line x1="725" y1="455" x2="825" y2="455" stroke="#667386" stroke-width="3"/><polygon points="825,455 808,445 808,465" fill="#667386"/>
<circle cx="900" cy="455" r="62" fill="#f5f0ff" stroke="#8065c9" stroke-width="3"/><text x="900" y="450" font-size="19" font-weight="700" fill="#5a4297">Human</text><text x="900" y="475" font-size="17" fill="#5a4297">decides</text>
<line x1="965" y1="455" x2="1065" y2="455" stroke="#667386" stroke-width="3"/><polygon points="1065,455 1048,445 1048,465" fill="#667386"/>
<circle cx="1140" cy="455" r="62" fill="#eef9f7" stroke="#36a18b" stroke-width="3"/><text x="1140" y="450" font-size="19" font-weight="700" fill="#287967">Capture</text><text x="1140" y="475" font-size="17" fill="#287967">missing knowledge</text>
</g>
<text x="70" y="570" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Direct examples</text>
<rect x="70" y="600" width="590" height="145" rx="16" fill="#f7fbf8" stroke="#cfe4d5"/>
<text x="100" y="640" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1f7a4d">Customer Support Request</text>
<text x="100" y="675" font-family="Arial, sans-serif" font-size="17" fill="#465365">AI reads relevant source and incident context</text>
<text x="100" y="705" font-family="Arial, sans-serif" font-size="17" fill="#465365">and explains why the customer request failed.</text>
<rect x="690" y="600" width="640" height="145" rx="16" fill="#f7fbf8" stroke="#cfe4d5"/>
<text x="720" y="640" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1f7a4d">Data Team Knowledge Gap</text>
<text x="720" y="675" font-family="Arial, sans-serif" font-size="17" fill="#465365">AI reads repository and SQL job context</text>
<text x="720" y="705" font-family="Arial, sans-serif" font-size="17" fill="#465365">and explains why synchronization did not happen.</text>
<text x="700" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Outcome: reduce unnecessary cross-team coordination without removing human ownership.</text>
</svg>