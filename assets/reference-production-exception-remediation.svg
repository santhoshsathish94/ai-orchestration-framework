<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="1500" height="900" fill="#fff"/>
<text x="65" y="70" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">2. Production Exception Remediation</text>
<text x="65" y="110" font-family="Arial, sans-serif" font-size="21" fill="#526071">AI moves from production exception to proven resolution with evidence and human approval.</text>
<rect x="65" y="145" width="1370" height="135" rx="18" fill="#f5f8fb" stroke="#d7dee8"/>
<text x="100" y="187" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Underlying problem</text>
<text x="100" y="225" font-family="Arial, sans-serif" font-size="18" fill="#465365">Exception handling is fragmented across investigation, code changes, review, deployment, and manual verification.</text>
<text x="100" y="255" font-family="Arial, sans-serif" font-size="18" fill="#465365">A fix can be deployed without proving that the original production problem was actually resolved.</text>
<text x="65" y="330" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f7a4d">Reference workflow</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<circle cx="135" cy="435" r="53" fill="#eef6ff" stroke="#5b8def" stroke-width="3"/><text x="135" y="430" font-size="17" font-weight="700" fill="#2454a6">Understand</text><text x="135" y="452" font-size="14" fill="#2454a6">context</text>
<line x1="190" y1="435" x2="275" y2="435" stroke="#667386" stroke-width="3"/><polygon points="275,435 258,425 258,445" fill="#667386"/>
<circle cx="330" cy="435" r="53" fill="#fff8e9" stroke="#d49a28" stroke-width="3"/><text x="330" y="430" font-size="17" font-weight="700" fill="#8a6515">Plan</text><text x="330" y="452" font-size="14" fill="#8a6515">root cause + fix</text>
<line x1="385" y1="435" x2="470" y2="435" stroke="#667386" stroke-width="3"/><polygon points="470,435 453,425 453,445" fill="#667386"/>
<circle cx="525" cy="435" r="53" fill="#f5f0ff" stroke="#8065c9" stroke-width="3"/><text x="525" y="430" font-size="17" font-weight="700" fill="#5a4297">Execute</text><text x="525" y="452" font-size="14" fill="#5a4297">focused change</text>
<line x1="580" y1="435" x2="665" y2="435" stroke="#667386" stroke-width="3"/><polygon points="665,435 648,425 648,445" fill="#667386"/>
<circle cx="720" cy="435" r="53" fill="#eef9f7" stroke="#36a18b" stroke-width="3"/><text x="720" y="430" font-size="17" font-weight="700" fill="#287967">Proof</text><text x="720" y="452" font-size="14" fill="#287967">non-prod</text>
<line x1="775" y1="435" x2="860" y2="435" stroke="#667386" stroke-width="3"/><polygon points="860,435 843,425 843,445" fill="#667386"/>
<circle cx="915" cy="435" r="53" fill="#fff4e8" stroke="#d68137" stroke-width="3"/><text x="915" y="430" font-size="17" font-weight="700" fill="#9a5b20">Human</text><text x="915" y="452" font-size="14" fill="#9a5b20">approval</text>
<line x1="970" y1="435" x2="1055" y2="435" stroke="#667386" stroke-width="3"/><polygon points="1055,435 1038,425 1038,445" fill="#667386"/>
<circle cx="1110" cy="435" r="53" fill="#eef6ff" stroke="#5b8def" stroke-width="3"/><text x="1110" y="430" font-size="17" font-weight="700" fill="#2454a6">Production</text><text x="1110" y="452" font-size="14" fill="#2454a6">deploy + observe</text>
<line x1="1165" y1="435" x2="1250" y2="435" stroke="#667386" stroke-width="3"/><polygon points="1250,435 1233,425 1233,445" fill="#667386"/>
<circle cx="1305" cy="435" r="53" fill="#f2f8f3" stroke="#4c9a68" stroke-width="3"/><text x="1305" y="430" font-size="17" font-weight="700" fill="#277142">Proof</text><text x="1305" y="452" font-size="14" fill="#277142">prod resolved</text>
</g>
<path d="M1305 495 C1305 560 150 560 150 495" fill="none" stroke="#4c9a68" stroke-width="3" stroke-dasharray="9 8"/><polygon points="150,495 138,514 162,514" fill="#4c9a68"/>
<text x="725" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#526071">If not resolved → return to Understand</text>
<rect x="65" y="625" width="1370" height="165" rx="18" fill="#f7fbf8" stroke="#cfe4d5"/>
<text x="100" y="665" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f7a4d">Evidence before approval</text>
<text x="100" y="702" font-family="Arial, sans-serif" font-size="17" fill="#465365">Root cause • why the fix works • exact change • tests • non-prod validation • risk • expected production signal</text>
<text x="100" y="742" font-family="Arial, sans-serif" font-size="17" fill="#465365">Human owns the production decision. The ticket closes only when the original production signal is proven resolved.</text>
<text x="100" y="775" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Examples: customer exception • performance spike • error-rate increase • data-quality issue</text>
<text x="750" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Built on: Opportunity → Understand → Plan → Execute → Proof → Grow</text>
</svg>