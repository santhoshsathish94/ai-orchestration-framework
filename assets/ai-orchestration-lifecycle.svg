<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">AI Orchestration Lifecycle</title>
  <desc id="desc">Opportunity, Understand, Plan, Execute, Proof, Grow, looping back to the next opportunity.</desc>
  <style>
    .stage { fill: #ffffff; stroke: #222222; stroke-width: 2; }
    .label { font: 600 22px Arial, sans-serif; fill: #111111; text-anchor: middle; }
    .arrow { fill: none; stroke: #555555; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="20" y="85" width="160" height="70" rx="12" class="stage"/>
  <rect x="210" y="85" width="160" height="70" rx="12" class="stage"/>
  <rect x="400" y="85" width="160" height="70" rx="12" class="stage"/>
  <rect x="590" y="85" width="160" height="70" rx="12" class="stage"/>
  <rect x="780" y="85" width="160" height="70" rx="12" class="stage"/>
  <rect x="970" y="85" width="160" height="70" rx="12" class="stage"/>
  <text x="100" y="128" class="label">Opportunity</text>
  <text x="290" y="128" class="label">Understand</text>
  <text x="480" y="128" class="label">Plan</text>
  <text x="670" y="128" class="label">Execute</text>
  <text x="860" y="128" class="label">Proof</text>
  <text x="1050" y="128" class="label">Grow</text>
  <path d="M180 120 H205" class="arrow"/>
  <path d="M370 120 H395" class="arrow"/>
  <path d="M560 120 H585" class="arrow"/>
  <path d="M750 120 H775" class="arrow"/>
  <path d="M940 120 H965" class="arrow"/>
  <path d="M1050 155 C1050 225 100 225 100 160" class="arrow"/>
  <text x="600" y="260" class="label" style="font-size:18px">Feedback, retrospective and better context → next opportunity</text>
</svg>
