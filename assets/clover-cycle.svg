<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -16 124 122" width="720" height="709" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">The Clover cycle</title>
  <desc id="cc-desc">A five-leaf clover. Clockwise from the top, the leaves are Context, Direction, Execution, Outcome and Growth.</desc>

  <defs>
    <linearGradient id="cc-leaf-fade" x1="0.18" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#17907f"/>
      <stop offset="0.55" stop-color="#0a6a5f"/>
      <stop offset="1" stop-color="#064f47"/>
    </linearGradient>

    <path id="cc-leaf" d="M50 44C48 35 38 31 38 21C38 12 46 9 50 17C54 9 62 12 62 21C62 31 52 35 50 44Z"/>
    <path id="cc-vein" d="M45.9 23.4C47.6 25 48.9 26.1 50 26.8C51.1 26.1 52.4 25 54.1 23.4"/>

    <!-- Label baselines. The lower two run anticlockwise so the text stays upright. -->
    <path id="cc-arc-top"         d="M28.20 12.87 A38 38 0 0 1 71.80 12.87"/>
    <path id="cc-arc-upper-right" d="M72.87 13.65 A38 38 0 0 1 86.34 55.11"/>
    <path id="cc-arc-lower-right" d="M50.77 87.99 A44 44 0 0 0 91.60 58.33"/>
    <path id="cc-arc-lower-left"  d="M8.40 58.33 A44 44 0 0 0 49.23 87.99"/>
    <path id="cc-arc-upper-left"  d="M13.66 55.11 A38 38 0 0 1 27.13 13.65"/>
  </defs>

  <!-- Each leaf sits a degree or two off the even split and a fraction off true scale, so no two are
       identical. The variation is deliberate and meant to go unnoticed. -->
  <g fill="url(#cc-leaf-fade)">
    <g transform="translate(50 44) scale(1.005 1.02) translate(-50 -44)"><use href="#cc-leaf"/></g>
    <g transform="rotate(70.8 50 44) translate(50 44) scale(0.968 0.994) translate(-50 -44)"><use href="#cc-leaf"/></g>
    <g transform="rotate(145.4 50 44) translate(50 44) scale(1.038 0.972) translate(-50 -44)"><use href="#cc-leaf"/></g>
    <g transform="rotate(215.2 50 44) translate(50 44) scale(0.984 1.031) translate(-50 -44)"><use href="#cc-leaf"/></g>
    <g transform="rotate(288.9 50 44) translate(50 44) scale(1.022 0.963) translate(-50 -44)"><use href="#cc-leaf"/></g>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(50 44) scale(1.005 1.02) translate(-50 -44)"><use href="#cc-vein"/></g>
    <g transform="rotate(70.8 50 44) translate(50 44) scale(0.968 0.994) translate(-50 -44)"><use href="#cc-vein"/></g>
    <g transform="rotate(145.4 50 44) translate(50 44) scale(1.038 0.972) translate(-50 -44)"><use href="#cc-vein"/></g>
    <g transform="rotate(215.2 50 44) translate(50 44) scale(0.984 1.031) translate(-50 -44)"><use href="#cc-vein"/></g>
    <g transform="rotate(288.9 50 44) translate(50 44) scale(1.022 0.963) translate(-50 -44)"><use href="#cc-vein"/></g>
  </g>

  <g font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="6" font-weight="650" fill="#39424d" text-anchor="middle">
    <text><textPath href="#cc-arc-top" startOffset="50%">Context</textPath></text>
    <text><textPath href="#cc-arc-upper-right" startOffset="50%">Direction</textPath></text>
    <text><textPath href="#cc-arc-lower-right" startOffset="50%">Execution</textPath></text>
    <text><textPath href="#cc-arc-lower-left" startOffset="50%">Outcome</textPath></text>
    <text><textPath href="#cc-arc-upper-left" startOffset="50%">Growth</textPath></text>
  </g>
</svg>
